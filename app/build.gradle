plugins { id 'com.android.application' }
android {
    namespace 'au.lite.launcher'
    compileSdk 34
    defaultConfig {
        applicationId 'au.lite.launcher'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError false }
}
